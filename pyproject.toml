[project]
name = "pdf-encoding-repair"
version = "0.1.0"
description = "Detect and repair PDF-extracted text corrupted by a constant character-code offset."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Md. Shihabuddin Sadi", email = "sadi.shihab@gmail.com" }]
keywords = ["pdf", "text-extraction", "encoding", "cmap", "tounicode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sadishihab/pdf-encoding-repair"
Repository = "https://github.com/sadishihab/pdf-encoding-repair"
Issues = "https://github.com/sadishihab/pdf-encoding-repair/issues"
Changelog = "https://github.com/sadishihab/pdf-encoding-repair/blob/main/CHANGELOG.md"

[project.scripts]
pdf-encoding-repair = "pdf_encoding_repair.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_encoding_repair"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
